name: Antigravity Scheduled Maintenance (every 3600s)

on:
  schedule:
    # Trigger at the start of every hour (3600 seconds)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  hourly-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Agent Maintenance Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINKGRAVITY_WEBHOOK_URL: ${{ secrets.LINKGRAVITY_WEBHOOK_URL }}
        run: |
          python main.py --cron
